# Valores por defecto del proyecto demanda-bicis-c5.
# Cada ruta se puede sobrescribir con la variable de entorno indicada al lado.
# Las rutas relativas se resuelven desde la carpeta que contiene este archivo.

rutas:
  zip_origen: bike_sharing_dataset.zip          # BICIS_ZIP_ORIGEN
  fuente_db: fuente/bicis.db                    # BICIS_FUENTE_DB
  staging_dir: data/staging                     # BICIS_STAGING_DIR
  salidas_db: data/salidas/predicciones.db      # BICIS_SALIDAS_DB
  modelo: models/modelo.joblib                  # BICIS_MODELO
  metricas: metrics.json                        # BICIS_METRICAS
  costos: configs/costos.yaml                   # BICIS_COSTOS

fuente:
  csv_en_zip: hour.csv
  tabla: registros_horarios

modelo:
  objetivo: cnt
  # Entrenamiento con enero-noviembre de 2011; MAE medido en diciembre de 2011.
  entrenamiento: {desde: "2011-01-01", hasta: "2011-11-30"}
  validacion: {desde: "2011-12-01", hasta: "2011-12-31"}
  features:
    - season
    - mnth
    - hr
    - holiday
    - weekday
    - workingday
    - weathersit
    - temp
    - atemp
    - hum
    - windspeed
  # Prohibidas como feature: casual y registered suman cnt (fuga del objetivo);
  # instant/dteday son identificadores; yr es constante en el año de entrenamiento.
  prohibidas: [casual, registered, instant, dteday, yr]
  # Modelo por defecto (--modelo lo cambia) e hiperparámetros de cada tipo.
  tipo: random_forest
  hiperparametros:
    random_forest:
      n_estimators: 300
      min_samples_leaf: 2
      random_state: 42
      n_jobs: -1
    extra_trees:
      n_estimators: 300
      min_samples_leaf: 2
      random_state: 42
      n_jobs: -1
    gradient_boosting:
      n_estimators: 300
      learning_rate: 0.1
      max_depth: 5
      random_state: 42

mlflow:
  experimento: demanda-bicis-c5
  repeticiones_latencia: 50
