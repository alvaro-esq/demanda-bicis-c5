# MLflow tracking server para demanda-bicis-c5.
#
# - Backend: SQLite en /mlflow/mlflow.db.
# - Artefactos: /mlflow/artifacts. El servidor los recibe por HTTP y los guarda
#   (--serve-artifacts): los clientes solo necesitan la URL, no acceso al disco.
# - Los dos viven en el volumen mlflow-data.
# - Red bicis-net: la crea este compose; Airflow se une a ella como red externa
#   y encuentra el servidor en http://mlflow:5000.
#
# Uso desde la raíz del repo: make mlflow-up   (antes de make airflow-up)
---
name: demanda-bicis-c5-mlflow

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    container_name: demanda-bicis-c5-mlflow
    hostname: mlflow
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      # Host headers aceptados: el navegador (localhost) y Airflow (mlflow:5000).
      - --allowed-hosts=localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      bicis-net:
        aliases: [mlflow]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mlflow-data:
    name: demanda-bicis-c5_mlflow-data

networks:
  bicis-net:
    name: bicis-net
